<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encuentra tu mesa · Antonio & Raffaella</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f2; --ink:#2b2a27; --muted:#7a7468; --line:#e3dccf;
    --accent:#2f4a3a; --gold:#b38a3c; --card:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-size:19px}
  .wrap{max-width:560px;margin:0 auto;padding:36px 20px 40px;min-height:100vh;display:flex;flex-direction:column}
  header{text-align:center}
  .script{font-family:'Pinyon Script','Snell Roundhand',cursive;font-size:44px;line-height:1.1;color:var(--gold);margin:0}
  h1{font-weight:500;font-size:25px;letter-spacing:.12em;text-transform:uppercase;margin:10px 0 6px}
  .meta{color:var(--muted);font-size:18px;letter-spacing:.04em}
  hr{border:0;border-top:1px solid var(--line);margin:22px auto;width:70%}
  .label{text-align:center;font-size:16px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  .field{width:100%;font:inherit;font-size:20px;padding:15px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:none}
  .field:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,74,58,.12)}
  .btn{display:block;margin:16px auto 0;font:inherit;font-weight:600;font-size:17px;letter-spacing:.2em;text-transform:uppercase;
    background:var(--accent);color:#fff;border:0;border-radius:10px;padding:15px 34px;cursor:pointer}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:11px 22px;font-size:15px}
  .results{list-style:none;margin:14px 0 0;padding:0}
  .results li{margin:0}
  .results button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;
    font:inherit;font-size:20px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin-bottom:8px;cursor:pointer;color:var(--ink)}
  .results button:active{background:#f3eee4}
  .results .tag{font-size:16px;color:var(--accent);font-weight:600;white-space:nowrap}
  .hint{text-align:center;color:var(--muted);font-size:17px;margin-top:14px}
  .hint.err{color:#8a3b2e}
  .result{display:none;text-align:center}
  .who{font-size:22px;color:var(--muted);margin:0}
  .big{font-size:74px;line-height:1;margin:2px 0 0;color:var(--accent);font-weight:600}
  .big small{display:block;font-size:16px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:4px}
  .map{position:relative;width:100%;margin:20px 0 12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .stage{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
  .stage img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
  .mark{position:absolute;transform:translate(-50%,-50%);border-radius:50%;
    background:rgba(179,138,60,.28);border:3px solid #c0392b;box-shadow:0 0 0 0 rgba(192,57,43,.55);animation:pulse 1.8s infinite}
  .mark.oval{border-radius:999px}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,57,43,.55)}70%{box-shadow:0 0 0 26px rgba(192,57,43,0)}100%{box-shadow:0 0 0 0 rgba(192,57,43,0)}}
  .legend{font-size:16px;color:var(--muted);margin:0 0 4px}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  footer{margin-top:auto;padding-top:28px;text-align:center;color:var(--muted);font-size:15px;letter-spacing:.06em}
</style>
</head>

const W0 = 840, H0 = 740;
const POS = {"21": [0.4048, 0.1878], "20": [0.4762, 0.1878], "11": [0.5476, 0.1878], "10": [0.619, 0.1878], "30": [0.3333, 0.277], "22": [0.4048, 0.277], "19": [0.4762, 0.277], "12": [0.5476, 0.277], "9": [0.619, 0.277], "1": [0.6905, 0.277], "29": [0.3333, 0.3635], "23": [0.4048, 0.3635], "0": [0.5071, 0.3635], "8": [0.619, 0.3635], "2": [0.6905, 0.3635], "28": [0.3333, 0.45], "24": [0.4048, 0.45], "18": [0.4762, 0.45], "13": [0.5476, 0.45], "7": [0.619, 0.45], "3": [0.6905, 0.45], "27": [0.3333, 0.5365], "25": [0.4048, 0.5365], "17": [0.4762, 0.5365], "14": [0.5476, 0.5365], "6": [0.619, 0.5365], "4": [0.6905, 0.5365], "26": [0.4048, 0.623], "16": [0.4762, 0.623], "15": [0.5476, 0.623], "5": [0.619, 0.623]};

const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const DATA = GUESTS.map(([n,m]) => ({n, m, k: norm(n).split(' ')}));

const $ = id => document.getElementById(id);
const q=$('q'), list=$('list'), msg=$('msg');

function search(text){
  const toks = norm(text).split(' ').filter(Boolean);
  if(!toks.length) return [];
  return DATA.filter(g => toks.every(t => g.k.some(w => w.startsWith(t))))
             .sort((a,b)=> a.n.localeCompare(b.n,'es'));
}
const label = m => m===0 ? 'Mesa de novios' : 'Mesa ' + m;

function render(){
  list.innerHTML=''; msg.textContent=''; msg.className='hint';
  const text=q.value;
  if(norm(text).length<2) return;
  const r = search(text);
  if(!r.length){ msg.textContent='No encontramos ese nombre. Prueba solo con tu apellido o revisa la ortografía.'; msg.className='hint err'; return; }
  r.slice(0,8).forEach(g=>{
    const li=document.createElement('li'), b=document.createElement('button');
    b.type='button';
    b.innerHTML='<span></span><span class="tag"></span>';
    b.children[0].textContent=g.n; b.children[1].textContent=label(g.m);
    b.onclick=()=>show(g);
    li.appendChild(b); list.appendChild(li);
  });
  if(r.length>8){ msg.textContent='Hay más resultados: escribe tu nombre completo.'; }
  else if(r.length>1){ msg.textContent='Toca tu nombre para ver tu mesa.'; }
}
q.addEventListener('input', render);
$('form').addEventListener('submit', e=>{
  e.preventDefault();
  const r=search(q.value);
  if(r.length===1) show(r[0]); else render();
  q.blur();
});

// ---- Mapa ----
let cur=null, zoomed=true;
function layout(){
  if(!cur) return;
  const map=$('map'), stage=$('stage');
  const W=map.clientWidth, ratio=H0/W0;
  const Hb=Math.round(W*(zoomed?0.82:ratio));
  map.style.height=Hb+'px';
  const s = zoomed ? 2.6 : 1;
  const w=W*s, h=W*ratio*s;
  stage.style.width=w+'px'; stage.style.height=h+'px';
  const [fx,fy]=POS[cur.m];
  let tx=W/2-fx*w, ty=Hb/2-fy*h;
  tx=Math.min(0,Math.max(W-w,tx)); ty=Math.min(0,Math.max(Hb-h,ty));
  stage.style.transform=`translate(${tx}px,${ty}px)`;
  const mk=$('mark'); mk.style.left=(fx*100)+'%'; mk.style.top=(fy*100)+'%';
  const oval = cur.m===0;
  mk.className='mark'+(oval?' oval':'');
  mk.style.width=(oval?14:7)+'%'; mk.style.height=(oval?6.6:(7*W0/H0))+'%';
  $('zoom').textContent = zoomed ? 'Ver plano completo' : 'Acercar a mi mesa';
}
function show(g){
  cur=g; zoomed=true;
  $('search').style.display='none'; $('result').style.display='block';
  $('who').textContent=g.n;
  $('big').innerHTML = g.m===0 ? '<small>Tu lugar</small>Mesa de novios' : '<small>Tu mesa</small>' + g.m;
  $('big').style.fontSize = g.m===0 ? '46px' : '';
  // sin transición en la primera pintura
  const st=$('stage'); st.style.transition='none'; layout(); void st.offsetWidth; st.style.transition='';
  window.scrollTo({top:0,behavior:'smooth'});
}
$('zoom').onclick=()=>{zoomed=!zoomed; layout();};
$('again').onclick=()=>{
  cur=null; $('result').style.display='none'; $('search').style.display='block';
  q.value=''; list.innerHTML=''; msg.textContent=''; q.focus();
};
window.addEventListener('resize', layout);
